<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!-- 部署到其他防红域名时，只需将这里改为主站地址。 -->
  <base href="https://www.huomaxia.com/">
  <title>正在打开...</title>
  <style>
    * { box-sizing: border-box; }
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    body { overflow: hidden; background: #fff; color: #344054; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    #loading, #error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; background: #fff; }
    .box { max-width: 300px; line-height: 1.7; }
    .spinner { width: 28px; height: 28px; margin: 0 auto 14px; border: 3px solid #dbeafe; border-top-color: #1677ff; border-radius: 50%; animation: spin .8s linear infinite; }
    #error { display: none; color: #667085; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="box"><div class="spinner"></div>正在安全打开链接...</div></div>
  <div id="error"><div class="box" id="error-text">链接暂时无法打开</div></div>
  <script>
    // 使用 base 指向的远程 server.js；时间戳避免防红域名侧缓存旧脚本。
    const serverScript = document.createElement('script');
    serverScript.src = new URL('fh/server.js?v=' + Date.now(), document.baseURI).href;
    document.body.appendChild(serverScript);
  </script>
</body>
</html>
